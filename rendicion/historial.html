<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    // Aplicar el tema guardado antes de pintar, para evitar el flash del tema incorrecto
    document.documentElement.setAttribute('data-theme', localStorage.getItem('rendicion_theme') === 'light' ? 'light' : 'dark');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Rendiciones — Sistema de Caja</title>
  <meta name="description" content="Historial y consulta de rendiciones de caja diarias">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Prevenir FOUC (flash de contenido no autorizado) */
    html:not(.authenticated) body > :not(#authGate) {
      display: none !important;
    }
  </style>
  <script>window.__PAGE_PERMISSION = 'rendicion';</script>
  <script src="/js/auth-gate.js"></script>
</head>
<body>

  <!-- ────────────────────────────────────────────────
       PANTALLA DE ACCESO ADMIN (compartida con el dashboard de Sweet SAS)
  ──────────────────────────────────────────────── -->
  <div id="authGate" style="
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #080d10 0%, #0d1a14 50%, #080d10 100%);
    align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
  ">
    <style>
      @keyframes authFadeIn  { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
      @keyframes authShake   { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
      @keyframes authPulse   { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.4)} 50%{box-shadow:0 0 0 12px rgba(16,185,129,0)} }
      #authBox {
        background: linear-gradient(160deg, #111e18 0%, #0d1810 100%);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 48px 44px 44px;
        width: 100%; max-width: 380px;
        animation: authFadeIn 0.5s ease forwards;
        box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      }
      .auth-icon {
        width: 64px; height: 64px;
        background: linear-gradient(135deg, #064e35, #0f7a50);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 2rem;
        margin: 0 auto 24px;
        animation: authPulse 2.5s ease infinite;
      }
      .auth-title {
        text-align: center;
        color: #eef2ee;
        font-size: 1.35rem; font-weight: 700;
        margin-bottom: 4px;
      }
      .auth-subtitle {
        text-align: center;
        color: #4d6655;
        font-size: 0.82rem; margin-bottom: 32px;
        text-transform: uppercase; letter-spacing: 1.2px;
      }
      .auth-label {
        display: block;
        color: #6b8c78;
        font-size: 0.72rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.8px;
        margin-bottom: 8px;
      }
      #authPassword {
        width: 100%; box-sizing: border-box;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        color: #eef2ee;
        padding: 13px 16px;
        border-radius: 10px;
        font-size: 1rem; font-family: 'Inter', sans-serif;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        letter-spacing: 2px;
      }
      #authPassword:focus {
        border-color: rgba(16,185,129,0.5);
        box-shadow: 0 0 0 3px rgba(16,185,129,0.12);
      }
      #authSubmit {
        width: 100%; margin-top: 16px;
        background: linear-gradient(135deg, #10b981, #059669);
        border: none; color: white;
        padding: 14px;
        border-radius: 10px;
        font-size: 0.9rem; font-weight: 700;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.15s;
        letter-spacing: 0.3px;
      }
      #authSubmit:hover  { opacity: 0.9; transform: translateY(-1px); }
      #authSubmit:active { transform: translateY(0); opacity: 1; }
      #authError {
        text-align: center;
        color: #f87171;
        font-size: 0.8rem; font-weight: 600;
        margin-top: 12px;
        opacity: 0;
        transition: opacity 0.25s;
        min-height: 20px;
      }
      .auth-footer {
        text-align: center;
        color: #2d3f35;
        font-size: 0.7rem;
        margin-top: 28px;
      }
    </style>

    <div id="authBox">
      <div class="auth-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <div class="auth-title">Acceso Restringido</div>
      <div class="auth-subtitle">Sweet SAS — Área Admin</div>
      <label class="auth-label" for="authPassword">Contraseña</label>
      <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      <button id="authSubmit">→ Ingresar al Dashboard</button>
      <div id="authError">Contraseña incorrecta</div>
      <div class="auth-footer">Solo administradores — Sweet &amp; Pop Express</div>
    </div>
  </div>

  <div class="app-container app-container--wide">
    <!-- Header -->
    <header class="app-header animate-in">
      <div class="app-header__brand">
        <div class="app-header__logo">$</div>
        <div>
          <h1 class="app-header__title">Historial de Rendiciones</h1>
          <p class="app-header__subtitle">Planilla Maestra</p>
        </div>
      </div>
      <nav class="app-header__nav">
        <button type="button" class="nav-link" id="theme-toggle">☀️ Claro</button>
        <a href="../index.html" class="nav-link">← Dashboard</a>
        <a href="index.html" class="nav-link">← Locales</a>
        <button class="nav-link" id="btn-export" title="Exportar a CSV">📥 Exportar</button>
      </nav>
    </header>

    <!-- Filters -->
    <div class="filters-bar animate-in animate-in--delay-1">
      <div class="form-group">
        <label class="form-label" for="filter-local">Local</label>
        <select class="form-select" id="filter-local">
          <option value="">Todos los locales</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="filter-turno">Turno</label>
        <select class="form-select" id="filter-turno">
          <option value="">Todos los turnos</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="filter-desde">Desde</label>
        <input type="date" class="form-input" id="filter-desde">
      </div>
      <div class="form-group">
        <label class="form-label" for="filter-hasta">Hasta</label>
        <input type="date" class="form-input" id="filter-hasta">
      </div>
    </div>

    <!-- Table -->
    <div class="card animate-in animate-in--delay-2" style="padding: 0; overflow: hidden;">
      <div class="table-wrapper" id="table-wrapper">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Totals Summary -->
    <div class="card animate-in animate-in--delay-3" id="totals-card" style="display:none;">
      <div class="card__header">
        <div class="card__icon card__icon--summary">📊</div>
        <div>
          <h2 class="card__title">Resumen del Período</h2>
          <p class="card__description" id="totals-count">0 rendiciones</p>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-sm);">
        <div class="summary-row summary-row--subtotal">
          <span class="summary-row__label">Total Efectivo</span>
          <span class="summary-row__value" id="sum-efectivo">$0</span>
        </div>
        <div class="summary-row summary-row--total">
          <span class="summary-row__label">Total Real</span>
          <span class="summary-row__value" id="sum-total-real">$0</span>
        </div>
        <div class="summary-row summary-row--subtotal">
          <span class="summary-row__label">Total Registrado</span>
          <span class="summary-row__value" id="sum-registrado" style="color: var(--text-primary);">$0</span>
        </div>
        <div class="summary-row summary-row--difference summary-row--zero" id="sum-diff-row">
          <span class="summary-row__label">Diferencia Total</span>
          <span class="summary-row__value" id="sum-diferencia">$0</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/historial.js"></script>
</body>
</html>
