<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    // Aplicar el tema guardado antes de pintar, para evitar el flash del tema incorrecto
    document.documentElement.setAttribute('data-theme', localStorage.getItem('rendicion_theme') === 'light' ? 'light' : 'dark');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Rendición de Caja</title>
  <meta name="description" content="Sistema de rendición de caja diaria para locales gastronómicos">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="/assets/logo-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Prevenir FOUC (flash de contenido no autorizado) */
    html:not(.authenticated) body > :not(#authGate) {
      display: none !important;
    }
  </style>
  <script>window.__PAGE_PERMISSION = 'rendicion';</script>
  <script src="/js/auth-gate.js"></script>
  <script src="/js/quick-nav.js"></script>
</head>
<body>

  <!-- ────────────────────────────────────────────────
       PANTALLA DE ACCESO ADMIN (compartida con el dashboard de Sweet SAS)
  ──────────────────────────────────────────────── -->
  <div id="authGate" style="
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #080d10 0%, #0d1a14 50%, #080d10 100%);
    align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
  ">
    <style>
      @keyframes authFadeIn  { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
      @keyframes authShake   { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
      @keyframes authPulse   { 0%,100%{box-shadow:0 0 0 0 rgba(29,138,99,0.4)} 50%{box-shadow:0 0 0 12px rgba(29,138,99,0)} }
      #authBox {
        background: linear-gradient(160deg, #111e18 0%, #0d1810 100%);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 48px 44px 44px;
        width: 100%; max-width: 380px;
        animation: authFadeIn 0.5s ease forwards;
        box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      }
      .auth-icon {
        width: 64px; height: 64px;
        background: linear-gradient(135deg, #0e4538, #1d8a63);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 2rem;
        margin: 0 auto 24px;
        animation: authPulse 2.5s ease infinite;
      }
      .auth-title {
        text-align: center;
        color: #eef2ee;
        font-size: 1.35rem; font-weight: 700;
        margin-bottom: 4px;
      }
      .auth-subtitle {
        text-align: center;
        color: #4d6655;
        font-size: 0.82rem; margin-bottom: 32px;
        text-transform: uppercase; letter-spacing: 1.2px;
      }
      .auth-label {
        display: block;
        color: #6b8c78;
        font-size: 0.72rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.8px;
        margin-bottom: 8px;
      }
      #authPassword {
        width: 100%; box-sizing: border-box;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        color: #eef2ee;
        padding: 13px 16px;
        border-radius: 10px;
        font-size: 1rem; font-family: 'Inter', sans-serif;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        letter-spacing: 2px;
      }
      #authPassword:focus {
        border-color: rgba(29,138,99,0.5);
        box-shadow: 0 0 0 3px rgba(29,138,99,0.12);
      }
      #authSubmit {
        width: 100%; margin-top: 16px;
        background: linear-gradient(135deg, #1d8a63, #156b4d);
        border: none; color: white;
        padding: 14px;
        border-radius: 10px;
        font-size: 0.9rem; font-weight: 700;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.15s;
        letter-spacing: 0.3px;
      }
      #authSubmit:hover  { opacity: 0.9; transform: translateY(-1px); }
      #authSubmit:active { transform: translateY(0); opacity: 1; }
      #authError {
        text-align: center;
        color: #f87171;
        font-size: 0.8rem; font-weight: 600;
        margin-top: 12px;
        opacity: 0;
        transition: opacity 0.25s;
        min-height: 20px;
      }
      .auth-footer {
        text-align: center;
        color: #2d3f35;
        font-size: 0.7rem;
        margin-top: 28px;
      }
    </style>

    <div id="authBox">
      <div class="auth-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <div class="auth-title">Acceso Restringido</div>
      <div class="auth-subtitle">Sweet SAS — Área Admin</div>
      <label class="auth-label" for="authPassword">Contraseña</label>
      <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      <button id="authSubmit">→ Ingresar al Dashboard</button>
      <div id="authError">Contraseña incorrecta</div>
      <div class="auth-footer">Solo administradores — Sweet &amp; Pop Express</div>
    </div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header animate-in">
      <div class="app-header__brand">
        <div class="app-header__logo"><img src="/assets/logo-128.png" alt="Sweet &amp; Pop Express"></div>
        <div>
          <h1 class="app-header__title">Rendición de Caja</h1>
          <p class="app-header__subtitle">Sistema de control diario</p>
        </div>
      </div>
      <nav class="app-header__nav">
        <button type="button" class="nav-link" id="theme-toggle">Claro</button>
        <a href="../index.html" class="nav-link">← Dashboard</a>
        <a href="../usuarios.html" class="nav-link" id="navUsersBtn" style="display:none;" data-role-gate="owner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Usuarios</a>
        <a href="../caja-chica/index.html" class="nav-link" title="Ir a Caja Chica"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg> Caja Chica</a>
        <a href="historial.html" class="nav-link" id="navHistorialBtn" style="display:none;" data-role-gate="owner,supervisor"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg> Historial</a>
      </nav>
    </header>

    <!-- Landing: Select Local -->
    <main class="landing">
      <h2 class="landing__title animate-in animate-in--delay-1">Seleccioná tu local</h2>
      <p class="landing__subtitle animate-in animate-in--delay-2">Elegí el local para cargar la rendición del turno</p>
      
      <div class="locals-grid animate-in animate-in--delay-3" id="locals-grid">
        <!-- Generated by JS -->
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // Mostrar solo los locales a los que este usuario tiene acceso.
    // Si solo tiene uno, saltear la selección e ir directo a cargarlo.
    window.sweetAuth.onReady(function (session) {
      const permitidos = (session.permissions && session.permissions.locales) || [];
      const locales = CONFIG.locales.filter(l => permitidos.includes(l.id));

      if (locales.length === 1) {
        location.replace(`carga.html?local=${locales[0].id}`);
        return;
      }

      const grid = document.getElementById('locals-grid');
      const storeIcon = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 1.5-4.5A2 2 0 0 1 5.4 1h13.2a2 2 0 0 1 1.9 1.5L22 7"/><path d="M4 7h16v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 21v-5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5"/></svg>';
      const lockIcon = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';

      if (locales.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <span class="empty-state__icon">${lockIcon}</span>
            <h3 class="empty-state__title">Sin locales asignados</h3>
            <p class="empty-state__text">Tu usuario no tiene ningún local asignado. Consultá con el dueño.</p>
          </div>
        `;
        return;
      }

      locales.forEach((local) => {
        const card = document.createElement('a');
        card.className = 'local-card';
        card.href = `carga.html?local=${local.id}`;
        card.innerHTML = `
          <span class="local-card__icon">${storeIcon}</span>
          <div class="local-card__name">${local.nombre}</div>
          <div class="local-card__action">Cargar rendición →</div>
        `;
        grid.appendChild(card);
      });
    });
  </script>
</body>
</html>
