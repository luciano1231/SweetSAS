<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fudo Pro - TPV & Gestión Gastronómica</title>
    <!-- Fuentes Google: Inter y Barlow -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/pos-lab/assets/index-BL6vgjEm.js"></script>
    <link rel="stylesheet" crossorigin href="/pos-lab/assets/index-CudzH7Ll.css">
    <meta name="robots" content="noindex, nofollow">
    <style>html:not(.authenticated) body > :not(#authGate) { display: none !important; }</style>
    <script>window.__PAGE_PERMISSION = 'tpv';</script>
    <script src="/js/auth-gate.js"></script>
  </head>
  <body class="bg-[#f3f4f6] text-slate-900 antialiased font-sans select-none overflow-hidden h-screen w-screen">
  <div id="authGate" style="
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #080d10 0%, #0d1a14 50%, #080d10 100%);
    align-items: center; justify-content: center; font-family: 'Inter', sans-serif;
  ">
    <style>
      @keyframes authFadeIn  { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
      @keyframes authShake   { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
      @keyframes authPulse   { 0%,100%{box-shadow:0 0 0 0 rgba(29,138,99,0.4)} 50%{box-shadow:0 0 0 12px rgba(29,138,99,0)} }
      #authBox { background: linear-gradient(160deg, #111e18 0%, #0d1810 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 48px 44px 44px; width: 100%; max-width: 380px; animation: authFadeIn 0.5s ease forwards; box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05); }
      .auth-icon { width: 64px; height: 64px; background: linear-gradient(135deg, #0e4538, #1d8a63); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 24px; animation: authPulse 2.5s ease infinite; }
      .auth-title { text-align: center; color: #eef2ee; font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
      .auth-subtitle { text-align: center; color: #4d6655; font-size: 0.82rem; margin-bottom: 32px; text-transform: uppercase; letter-spacing: 1.2px; }
      .auth-label { display: block; color: #6b8c78; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
      #authPassword { width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #eef2ee; padding: 13px 16px; border-radius: 10px; font-size: 1rem; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s, box-shadow 0.2s; letter-spacing: 2px; }
      #authPassword:focus { border-color: rgba(29,138,99,0.5); box-shadow: 0 0 0 3px rgba(29,138,99,0.12); }
      #authSubmit { width: 100%; margin-top: 16px; background: linear-gradient(135deg, #1d8a63, #156b4d); border: none; color: white; padding: 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; transition: opacity 0.2s, transform 0.15s; letter-spacing: 0.3px; }
      #authSubmit:hover  { opacity: 0.9; transform: translateY(-1px); }
      #authSubmit:active { transform: translateY(0); opacity: 1; }
      #authError { text-align: center; color: #f87171; font-size: 0.8rem; font-weight: 600; margin-top: 12px; opacity: 0; transition: opacity 0.25s; min-height: 20px; }
      .auth-footer { text-align: center; color: #2d3f35; font-size: 0.7rem; margin-top: 28px; }
    </style>

    <div id="authBox">
      <div class="auth-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <div class="auth-title">Acceso Restringido</div>
      <div class="auth-subtitle">TPV Rissione — Sweet SAS</div>
      <label class="auth-label" for="authPassword">Contraseña o PIN</label>
      <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      <button id="authSubmit">→ Ingresar al TPV</button>
      <div id="authError">Contraseña incorrecta</div>
      <div class="auth-footer">Dueño o personal del local Rissione — Sweet &amp; Pop Express</div>
    </div>
  </div>

    <div id="root" class="h-full w-full"></div>
  </body>
</html>
