<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('rendicion_theme') === 'light' ? 'light' : 'dark');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayoristas — Sweet & Pop Express</title>
  <meta name="description" content="Clientes mayoristas y remitos">
  <link rel="stylesheet" href="../rendicion/css/styles.css">
  <link rel="icon" href="/assets/logo-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html:not(.authenticated) body > :not(#authGate) { display: none !important; }
    .new-cliente-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: var(--space-md); align-items: end; }
    @media (max-width: 700px) { .new-cliente-grid { grid-template-columns: 1fr; } }
    .cliente-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
    .cliente-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .data-table .cell--muted { color: var(--text-muted); }
  </style>
  <script>window.__PAGE_PERMISSION = 'mayoristas';</script>
  <script src="/js/auth-gate.js"></script>
  <script src="/js/quick-nav.js"></script>
</head>
<body>

  <div id="authGate" style="
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #080d10 0%, #0d1a14 50%, #080d10 100%);
    align-items: center; justify-content: center; font-family: 'Inter', sans-serif;
  ">
    <style>
      @keyframes authFadeIn  { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
      @keyframes authShake   { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
      @keyframes authPulse   { 0%,100%{box-shadow:0 0 0 0 rgba(29,138,99,0.4)} 50%{box-shadow:0 0 0 12px rgba(29,138,99,0)} }
      #authBox { background: linear-gradient(160deg, #111e18 0%, #0d1810 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 48px 44px 44px; width: 100%; max-width: 380px; animation: authFadeIn 0.5s ease forwards; box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05); }
      .auth-icon { width: 64px; height: 64px; background: linear-gradient(135deg, #0e4538, #1d8a63); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 24px; animation: authPulse 2.5s ease infinite; }
      .auth-title { text-align: center; color: #eef2ee; font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
      .auth-subtitle { text-align: center; color: #4d6655; font-size: 0.82rem; margin-bottom: 32px; text-transform: uppercase; letter-spacing: 1.2px; }
      .auth-label { display: block; color: #6b8c78; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
      #authPassword { width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #eef2ee; padding: 13px 16px; border-radius: 10px; font-size: 1rem; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s, box-shadow 0.2s; letter-spacing: 2px; }
      #authPassword:focus { border-color: rgba(29,138,99,0.5); box-shadow: 0 0 0 3px rgba(29,138,99,0.12); }
      #authSubmit { width: 100%; margin-top: 16px; background: linear-gradient(135deg, #1d8a63, #156b4d); border: none; color: white; padding: 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; transition: opacity 0.2s, transform 0.15s; letter-spacing: 0.3px; }
      #authSubmit:hover  { opacity: 0.9; transform: translateY(-1px); }
      #authSubmit:active { transform: translateY(0); opacity: 1; }
      #authError { text-align: center; color: #f87171; font-size: 0.8rem; font-weight: 600; margin-top: 12px; opacity: 0; transition: opacity 0.25s; min-height: 20px; }
      .auth-footer { text-align: center; color: #2d3f35; font-size: 0.7rem; margin-top: 28px; }
    </style>

    <div id="authBox">
      <div class="auth-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <div class="auth-title">Acceso Restringido</div>
      <div class="auth-subtitle">Sweet SAS — Área Admin</div>
      <label class="auth-label" for="authPassword">Contraseña</label>
      <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      <button id="authSubmit">→ Ingresar al Dashboard</button>
      <div id="authError">Contraseña incorrecta</div>
      <div class="auth-footer">Solo administradores — Sweet &amp; Pop Express</div>
    </div>
  </div>

  <div class="app-container">
    <header class="app-header animate-in">
      <div class="app-header__brand">
        <div class="app-header__logo"><img src="/assets/logo-128.png" alt="Sweet &amp; Pop Express"></div>
        <div>
          <h1 class="app-header__title">Mayoristas</h1>
          <p class="app-header__subtitle">Clientes y remitos</p>
        </div>
      </div>
      <nav class="app-header__nav">
        <button type="button" class="nav-link" id="theme-toggle">Claro</button>
        <a href="../index.html" class="nav-link">← Dashboard</a>
      </nav>
    </header>

    <div class="tabs animate-in animate-in--delay-1">
      <a href="index.html" class="nav-link nav-link--active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg> Clientes</a>
      <a href="listas.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg> Listas de Productos</a>
      <a href="libro-mayor.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg> Libro Mayor</a>
    </div>

    <div class="card animate-in animate-in--delay-2">
      <div class="card__header">
        <div class="card__icon card__icon--cash"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
        <div>
          <h2 class="card__title">Nuevo Cliente</h2>
          <p class="card__description">Elegí qué lista de productos va a poder pedir, y en qué número de remito arranca</p>
        </div>
      </div>
      <div class="new-cliente-grid">
        <input type="text" class="form-input" id="new-cli-nombre" placeholder="Ej: Magui" autocomplete="off">
        <select class="form-select form-input" id="new-cli-lista"><option value="">Catálogo general (Mayoristas)</option></select>
        <input type="number" class="form-input" id="new-cli-numero" placeholder="Próximo N° remito" min="1" step="1" value="1">
        <button type="button" class="btn btn--submit" id="btn-add-cli">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Crear
        </button>
      </div>
    </div>

    <div class="animate-in animate-in--delay-3" style="display: flex; justify-content: flex-end; margin-bottom: var(--space-sm);">
      <label class="filter-checkbox" for="filter-deshabilitados">
        <input type="checkbox" id="filter-deshabilitados">
        Mostrar deshabilitados
      </label>
    </div>

    <div class="card animate-in animate-in--delay-4" style="padding: 0; overflow: hidden;">
      <div class="table-wrapper" id="table-wrapper"><!-- Generated by JS --></div>
    </div>
  </div>

  <script src="../rendicion/js/utils.js"></script>
  <script src="../rendicion/js/theme.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
